- name: Install curl
  become: true
  apt:
    name: curl
    state: present

- name: Install unzip
  become: true
  apt:
    name: unzip
    state: present

- name: Install fnm
  become: true
  shell:
    cmd: curl -o- https://fnm.vercel.app/install | bash


- name: Install node
  become: true
  shell:
    cmd: export PATH="$HOME/.local/share/fnm:$PATH" && eval "$(fnm env)" && fnm install --use 26